[tox]
envlist = cov-init, 3.12-py2neo_2021, cov-report
tox_pip_extensions_ext_venv_update = true
minversion = 4.0
requires =
    tox >= 4

[testenv]
package = editable
setenv =
    COVERAGE_FILE = .coverage.{envname}
    NEO4J_URI = {env:NEO4J_URI:bolt://localhost:7687}
passenv =
    HOME
    PIP_*
    COVERAGE_*
    PYTHON*
extras =
    test
    py2neo_2021: py2neo2021
commands =
    pytest \
        --basetemp={envtmpdir} \
        --cov \
        --cov-config={toxinidir}/.coveragerc \
        --cov-report= \
        --junit-xml={toxinidir}/junit-{envname}.xml \
        --junit-prefix={envname} \
        {posargs}
    ; Instead of pytest-cov's term reporting, use coverage.py's so we can
    ; combine paths -- otherwise the report is split between the installed
    ; dist files and src files

[testenv:cov-init]
deps = coverage
skip_install = True
setenv =
    COVERAGE_FILE = .coverage
commands =
    coverage erase

[testenv:cov-report]
deps =
    coverage
skip_install = True
ignore_outcome = True
setenv =
    COVERAGE_FILE = .coverage
commands =
    - coverage combine --keep
    coverage xml
    coverage report
    coverage html
