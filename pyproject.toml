[build-system]
requires = [
    "setuptools",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "py2neo_compat"
authors = [{name = "Wil Cooley", email = "wcooley@nakedape.cc"}]
license = {text = "Apache Software License 2.0"}
description = "Compatibility layer for py2neo"
dynamic = ["version"]
keywords = ["py2neo_compat", "py2neo", "compat", "neo4j"]
requires-python = ">= 3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
#    "Programming Language :: Python :: 3.13",
#    "Programming Language :: Python :: 3.14",
]
urls = {Homepage = "https://github.com/wcooley/python-py2neo_compat"}
dependencies = [
    "boltons",
    "py2neo",
]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest >= 3.3.0",
    "pytest-cov",
]
py2neo2021 = [
    "py2neo~=2021.2.4"
]

[tool.setuptools]
package-dir = {"" = "src"}
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["py2neo_compat"]
namespaces = false

[tool.setuptools_scm]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
